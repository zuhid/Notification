<div class="wrapper">
  <table class="main-content" cellpadding="0" cellspacing="0">
    <!-- Logo Section -->
    <tr>
      <td class="header">
        <h1 style="margin: 0; color: #111827; font-size: 28px;">YourBrand</h1>
      </td>
    </tr>

    <!-- Message Section -->
    <tr>
      <td class="body-text">
        <h2 style="color: #111827; margin-top: 0;">Your verification code</h2>
        <p>Hi {{email}},</p>
        <p>Use the code below to complete your sign-in. This code will expire shortly.</p>
      </td>
    </tr>

    <!-- Code Section -->
    <tr>
      <td class="button-container">
        <span class="code">{{token}}</span>
      </td>
    </tr>

    <!-- Footer note -->
    <tr>
      <td class="body-text" style="font-size: 13px; border-top: 1px solid #e5e7eb; padding-top: 20px;">
        <p>If you didn't request this code, you can safely ignore this email.</p>
      </td>
    </tr>
  </table>

  <!-- Footer -->
  <table style="width: 100%; max-width: 600px; margin: 0 auto;">
    <tr>
      <td class="footer">
        <p>© 2026 YourBrand Inc. | 123 Main St, City, Country</p>
      </td>
    </tr>
  </table>
</div>
